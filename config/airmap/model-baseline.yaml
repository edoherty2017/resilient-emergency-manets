schema_version: 2
run_profile: trial2_baseline
model:
  # Honest label: the implemented model is pure free-space path loss. A
  # terrain-aware ITM/Longley-Rice engine is planned (review P2 item 12) but
  # NOT implemented — never cite this baseline as terrain-aware.
  name: fspl_baseline
  version: 1.0.0
  # sha256 of the canonical model spec string:
  # fspl_baseline:PL_db=32.44+20*log10(d_km)+20*log10(f_mhz);f=915MHz;tx_conducted_dbm=22;tx_ant_gain_dbi=2.15;rx_ant_gain_dbi=2.15;rx_feed_loss_db=0;preset=LongFast(SF11,BW250kHz,CR4/5);rx_sens_dbm=-131
  hash: "223b26248dad1dd061e424a2992a09a7632cb698a8e7b1ec2d9fe52b71177a88"
  frequency_mhz: 915
  polarization: vertical
  notes: >-
    FSPL-only baseline (n=2 lower bound). Radio assumptions: Meshtastic LongFast
    preset = SF11 / BW 250 kHz / CR 4/5, data rate 1.07 kbps, sensitivity ~ -131 dBm
    (Meshtastic radio-settings link-budget table; Semtech SX1262 datasheet).
    TX 22 dBm with 2.15 dBi transmit antenna (TX EIRP 24.15 dBm), plus
    2.15 dBi receive antenna gain. The 26.3 dBm sum is the receiver-power
    reference before path loss, not EIRP. Feed losses are assumed 0 dB and
    must be measured.
radio:
  preset: LongFast
  spreading_factor: 11
  bandwidth_khz: 250
  coding_rate: "4/5"
  data_rate_kbps: 1.07
  tx_conducted_dbm: 22.0
  tx_antenna_gain_dbi: 2.15
  tx_feed_loss_db: 0.0
  tx_eirp_dbm: 24.15
  rx_antenna_gain_dbi: 2.15
  rx_feed_loss_db: 0.0
  rx_power_reference_dbm: 26.3
  rx_sensitivity_dbm: -131.0
  noise_floor_dbm: -114.0
features:
  recipe_version: v1.0.0
  # Only features the implemented model/evaluation actually consumes.
  required:
    - distance_m            # 3D slant distance, GPS both ends
    - topography_class      # stratification only (not a model input yet)
  planned_itm_inputs:
    - tx_height_m
    - rx_height_m
    - dem_elevation_profile
    - obstruction_depth_m
outputs:
  fields:
    - timestamp_utc
    - trial_id
    - head_id
    - node_id
    - segment_id
    - distance_m
    - distance_source
    - pred_path_loss_db
    - pred_rssi_dbm
    - pred_link_margin_db   # margin above sensitivity; renamed from pred_snr_db (it was never an SNR)
    - topography_class
    - material_class
    - calibration_eligible
    - model_name
    - model_version
    - model_hash
    - feature_recipe_version
    - calibration_version
